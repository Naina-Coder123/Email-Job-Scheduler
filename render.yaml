# Render Blueprint — provisions Postgres, Redis, the API, and the BullMQ
# worker in one shot. In the Render dashboard: New -> Blueprint -> select
# this repo -> Render reads this file and creates everything below.
#
# NOTE on cost: Render's free tier only covers a Web Service (and it spins
# down after 15 min idle, which is a bad fit for a worker that needs to be
# always-on to process delayed jobs on time). Redis and Background Workers
# require at least the "Starter" plan. Swap `plan: starter` -> `plan: free`
# below only for the web service if you want to stay fully free and accept
# the API cold-starting; the worker and Redis still need a paid plan to run
# continuously.

databases:
  - name: email-scheduler-db
    databaseName: email_scheduler
    plan: free
    postgresMajorVersion: "16"

services:
  # --- Redis: backs BullMQ (the scheduler) and the rate-limit counters ---
  - type: redis
    name: email-scheduler-redis
    plan: starter
    ipAllowList: [] # only accessible from other services in this account

  # --- Express API ---
  - type: web
    name: email-scheduler-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /healthz
    envVars:
      - fromGroup: email-scheduler-shared
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: email-scheduler-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: email-scheduler-redis
          property: port
      - key: PORT
        value: "4000"
      # Set this to your deployed Vercel URL once you have it (CORS origin).
      - key: FRONTEND_URL
        sync: false
      - key: SLACK_REDIRECT_URI
        value: https://email-scheduler-api.onrender.com/api/slack/callback
      - key: BULL_BOARD_USER
        sync: false
      - key: BULL_BOARD_PASSWORD
        generateValue: true

  # --- BullMQ worker (separate long-running process; scale replicas here
  #     independently of the API for more send throughput) ---
  - type: worker
    name: email-scheduler-worker
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:worker
    envVars:
      - fromGroup: email-scheduler-shared
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: email-scheduler-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: email-scheduler-redis
          property: port

# Shared config between the API and worker so it's declared once.
envVarGroups:
  - name: email-scheduler-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      # Same Client ID the frontend uses — the backend verifies Google ID
      # tokens against this audience. Fill in after creating your OAuth app.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      # Optional: point at a managed ES instance (e.g. Bonsai, Elastic
      # Cloud). Leave unset and the app falls back to Postgres search.
      - key: ELASTICSEARCH_NODE
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: emails
